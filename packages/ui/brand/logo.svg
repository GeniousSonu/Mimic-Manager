<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Mimic Manager — layered gold icon</title>
  <desc>Scalable vector icon of three floating rounded-square frames in gold and amber, with translucent glass layers and a hollow center.</desc>
  <defs>
    <linearGradient id="topFace" x1="220" y1="170" x2="800" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF16B"/><stop offset=".22" stop-color="#FFC928"/><stop offset=".52" stop-color="#FFB000"/><stop offset=".78" stop-color="#FF8A00"/><stop offset="1" stop-color="#E96800"/>
    </linearGradient>
    <linearGradient id="topSide" x1="250" y1="365" x2="760" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B95800"/><stop offset=".28" stop-color="#FFB51B"/><stop offset=".55" stop-color="#F17B00"/><stop offset=".78" stop-color="#C75B00"/><stop offset="1" stop-color="#8B3500"/>
    </linearGradient>
    <linearGradient id="midFace" x1="180" y1="450" x2="830" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB51B"/><stop offset=".3" stop-color="#FF9A00"/><stop offset=".62" stop-color="#FF8200"/><stop offset="1" stop-color="#D95B00"/>
    </linearGradient>
    <linearGradient id="midSide" x1="240" y1="625" x2="760" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A84900"/><stop offset=".3" stop-color="#F88A00"/><stop offset=".58" stop-color="#D96700"/><stop offset="1" stop-color="#793000"/>
    </linearGradient>
    <linearGradient id="baseFace" x1="190" y1="620" x2="820" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D96500"/><stop offset=".28" stop-color="#FF8700"/><stop offset=".58" stop-color="#D85A00"/><stop offset="1" stop-color="#873400"/>
    </linearGradient>
    <linearGradient id="glass" x1="365" y1="315" x2="670" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7D8" stop-opacity=".76"/><stop offset=".32" stop-color="#FFD994" stop-opacity=".42"/><stop offset=".68" stop-color="#FFB54A" stop-opacity=".18"/><stop offset="1" stop-color="#7A3900" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="360" y1="300" x2="650" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCE8" stop-opacity=".96"/><stop offset=".45" stop-color="#FFD87B" stop-opacity=".75"/><stop offset="1" stop-color="#FF8B00" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="innerDark" x1="350" y1="270" x2="690" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8C3C00"/><stop offset=".5" stop-color="#4C2100"/><stop offset="1" stop-color="#A84A00"/>
    </linearGradient>
    <radialGradient id="spark" cx="0" cy="0" r="1" gradientTransform="translate(-2 -3) rotate(60) scale(7)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDE3"/><stop offset=".36" stop-color="#FFE96A"/><stop offset="1" stop-color="#FF9A00"/>
    </radialGradient>
    <filter id="shadow" x="80" y="100" width="864" height="850" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="glow" x="0" y="0" width="1024" height="1024" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Rounded diamond-ring geometry; each layer has a top face and a deep extruded side. -->
  </defs>

  <!-- soft grounding shadow -->
  <path d="M174 710 512 520 850 710 512 914Z" fill="#1C0B00" opacity=".46" filter="url(#shadow)"/>

  <!-- lowest amber frame -->
  <path d="M512 621 838 805Q855 815 838 829L538 1000Q512 1015 486 1000L186 829Q169 815 186 805Z" fill="#6C2A00" opacity=".82"/>
  <path d="M512 584 838 768Q855 778 838 792L538 963Q512 978 486 963L186 792Q169 778 186 768Z" fill="url(#baseFace)" stroke="#FF9A20" stroke-width="3"/>
  <path d="M512 635 765 778 512 923 259 778Z" fill="#311400" stroke="#A64B00" stroke-width="3"/>
  <path d="M512 648 746 780 512 913 278 780Z" fill="#180B03" opacity=".84"/>
  <path d="M512 584 838 768Q855 778 838 792L538 963Q512 978 486 963L186 792Q169 778 186 768Z" stroke="#FFB04A" stroke-opacity=".58" stroke-width="2"/>

  <!-- middle frame extrusion and upper surface -->
  <path d="M512 432 837 616Q856 627 837 641L538 812Q512 827 486 812L187 641Q168 627 187 616Z" fill="#793000"/>
  <path d="M512 394 837 578Q856 589 837 603L538 774Q512 789 486 774L187 603Q168 589 187 578Z" fill="url(#midFace)" stroke="#FFB13A" stroke-width="3"/>
  <path d="M512 448 759 588 512 728 265 588Z" fill="url(#innerDark)" stroke="#C35B00" stroke-width="3"/>
  <path d="M512 465 733 590 512 715 291 590Z" fill="#241000" opacity=".9"/>
  <path d="M512 394 837 578Q856 589 837 603L538 774Q512 789 486 774L187 603Q168 589 187 578Z" stroke="#FFC15A" stroke-opacity=".7" stroke-width="2"/>

  <!-- top frame: extrusion first -->
  <path d="M512 234 837 418Q856 429 837 443L538 614Q512 629 486 614L187 443Q168 429 187 418Z" fill="url(#topSide)" stroke="#A64A00" stroke-width="2"/>
  <path d="M512 284 774 433 512 582 250 433Z" fill="#3C1A00" opacity=".94"/>
  <path d="M512 300 747 434 512 568 277 434Z" fill="#1E0D00" opacity=".94"/>

  <!-- translucent glass core: three softly faceted panes -->
  <path d="M365 300Q365 287 378 280L497 213Q512 205 527 213L646 280Q659 287 659 300V565Q659 579 646 587L527 655Q512 664 497 655L378 587Q365 579 365 565Z" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="3"/>
  <path d="M365 300 512 385 659 300 659 565Q659 579 646 587L527 655Q512 664 497 655L378 587Q365 579 365 565Z" fill="#FFC45A" fill-opacity=".12"/>
  <path d="M365 300 512 385 659 300M365 300 365 565M659 300 659 565" stroke="#FFF3C9" stroke-opacity=".72" stroke-width="2.5"/>
  <path d="M378 587 512 510 646 587M512 385V510" stroke="#FFE4A1" stroke-opacity=".48" stroke-width="2"/>
  <path d="M384 307 512 233 640 307" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2"/>



  <!-- top golden rounded-square ring -->
  <path d="M501 137Q512 131 523 137L839 316Q860 328 839 350L535 523Q512 536 489 523L185 350Q164 338 185 316Z
           M512 198 271 335 512 472 753 335Z" fill="url(#topFace)" fill-rule="evenodd" stroke="#FFC84A" stroke-width="3" stroke-linejoin="round"/>
  <!-- front bevel / thickness of the top ring -->
  <path d="M185 316 489 489Q512 502 535 489L839 316 839 350Q860 362 839 374L535 547Q512 560 489 547L185 374Q164 362 185 350Z" fill="url(#topSide)" stroke="#E67A00" stroke-width="2"/>
  <path d="M185 316 489 489Q512 502 535 489L839 316" stroke="#FFF17C" stroke-width="5" stroke-linecap="round" opacity=".94"/>
  <path d="M271 335 512 472 753 335" stroke="#FFDF65" stroke-width="3" stroke-linecap="round" opacity=".78"/>

  <!-- bright edge glints -->
  <g filter="url(#glow)">
    <circle cx="412" cy="310" r="5" fill="url(#spark)"/><circle cx="612" cy="310" r="5" fill="url(#spark)"/>
    <circle cx="512" cy="385" r="7" fill="url(#spark)"/><circle cx="440" cy="500" r="4.5" fill="url(#spark)"/>
    <circle cx="584" cy="500" r="4.5" fill="url(#spark)"/><circle cx="512" cy="602" r="5" fill="url(#spark)"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M188 317Q174 329 190 340" stroke="#FFF27D" stroke-width="3" opacity=".9"/>
    <path d="M836 317Q850 329 834 340" stroke="#FF9E17" stroke-width="3" opacity=".9"/>
    <path d="M188 578Q174 590 190 601" stroke="#FFB343" stroke-width="2.5" opacity=".7"/>
    <path d="M836 578Q850 590 834 601" stroke="#FF8A12" stroke-width="2.5" opacity=".7"/>
  </g>
</svg>
