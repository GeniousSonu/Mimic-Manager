# Render Blueprint Specification for Mimic Manager
# Free web service deployment with in-process BullMQ worker
services:
  - type: web
    name: mimic-manager-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: IN_PROCESS_WORKER
        value: "true"
      - key: RUN_IN_PROCESS_WORKER
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_PATH
        value: /tmp/mimic-manager/storage
