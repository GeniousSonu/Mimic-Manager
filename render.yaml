        value: redis://default:huUHbKPYM59eSIZ45Rr4N2xXIxXJKGWX@jump-textural-constructive-72143.db.redis.io:19041
      - key: REDIS_URL
        value: redis://default:huUHbKPYM59eSIZ45Rr4N2xXIxXJKGWX@jump-textural-constructive-72143.db.redis.io:19041
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
